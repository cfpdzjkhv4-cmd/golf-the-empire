<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="900" viewBox="0 0 1290 900">
  <!-- Title hero: a links course at dawn, in the style of a mid century railway poster.
       Flat shapes, a limited palette, light from the low sun on the left, a little grain. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F4B6E"/>
      <stop offset="0.45" stop-color="#C98E7A"/>
      <stop offset="0.72" stop-color="#F2C98F"/>
      <stop offset="1" stop-color="#F7E2B5"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9C99A"/>
      <stop offset="0.25" stop-color="#7FA2B0"/>
      <stop offset="1" stop-color="#3E6A82"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF4D6"/>
      <stop offset="0.6" stop-color="#FBE3A8"/>
      <stop offset="1" stop-color="#FBE3A8" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.09"/></feComponentTransfer>
      <feComposite in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>

  <!-- Sky, sun and a few long clouds -->
  <rect width="1290" height="900" fill="url(#sky)"/>
  <circle cx="300" cy="455" r="210" fill="url(#sun)"/>
  <circle cx="300" cy="455" r="78" fill="#FFF1CF"/>
  <g fill="#F6D7B0" opacity="0.75">
    <rect x="560" y="250" width="420" height="10" rx="5"/>
    <rect x="640" y="272" width="300" height="8" rx="4"/>
    <rect x="80" y="330" width="260" height="8" rx="4"/>
    <rect x="980" y="360" width="250" height="7" rx="3.5"/>
  </g>
  <g fill="#E8B9A0" opacity="0.6">
    <rect x="700" y="300" width="360" height="7" rx="3.5"/>
    <rect x="30" y="360" width="180" height="6" rx="3"/>
  </g>

  <!-- Sea and the far headland with its lighthouse -->
  <rect y="470" width="1290" height="200" fill="url(#sea)"/>
  <path d="M780 482 C 860 450, 930 440, 1010 452 C 1080 462, 1150 448, 1290 440 L1290 486 L780 486 Z" fill="#6E7E94"/>
  <path d="M900 486 C 980 470, 1060 468, 1140 474 C 1200 478, 1250 470, 1290 466 L1290 492 L900 492 Z" fill="#5C6D84"/>
  <g transform="translate(1150 424)">
    <rect x="-7" y="0" width="14" height="40" fill="#EDE3D0"/>
    <rect x="-7" y="10" width="14" height="7" fill="#B5523B"/>
    <rect x="-7" y="26" width="14" height="7" fill="#B5523B"/>
    <rect x="-9" y="-9" width="18" height="10" fill="#3E4A5C"/>
    <path d="M-10 -9 L0 -18 L10 -9 Z" fill="#B5523B"/>
    <path d="M9 -5 L120 -26 L120 10 Z" fill="#FFF1CF" opacity="0.35"/>
  </g>
  <!-- Sun on the water -->
  <g fill="#FFF1CF" opacity="0.8">
    <rect x="230" y="500" width="140" height="4" rx="2"/>
    <rect x="250" y="516" width="100" height="4" rx="2"/>
    <rect x="270" y="534" width="60" height="3" rx="1.5"/>
    <rect x="205" y="552" width="190" height="3" rx="1.5" opacity="0.5"/>
  </g>
  <!-- Surf line -->
  <path d="M0 640 C 120 628, 240 650, 380 636 C 520 622, 640 646, 800 634 C 960 622, 1100 642, 1290 630 L1290 660 L0 660 Z" fill="#EAF0EE" opacity="0.85"/>
  <path d="M0 652 C 160 644, 300 662, 460 650 C 640 638, 820 660, 1000 648 C 1120 640, 1210 652, 1290 646 L1290 900 L0 900 Z" fill="#E4D3A2"/>

  <!-- Dunes, back to front -->
  <path d="M0 690 C 140 640, 260 650, 380 680 C 480 705, 560 660, 700 640 C 840 622, 980 670, 1110 650 C 1190 638, 1250 650, 1290 660 L1290 900 L0 900 Z" fill="#A4A866"/>
  <path d="M0 748 C 160 700, 330 715, 470 742 C 600 766, 720 728, 860 712 C 1010 696, 1160 740, 1290 726 L1290 900 L0 900 Z" fill="#8C9752"/>
  <!-- The green and its bunkers, lit from the left -->
  <ellipse cx="760" cy="782" rx="250" ry="56" fill="#6E7A3F" opacity="0.6"/>
  <ellipse cx="750" cy="772" rx="245" ry="52" fill="#9CCB64"/>
  <ellipse cx="700" cy="764" rx="150" ry="28" fill="#B4DC7E" opacity="0.7"/>
  <path d="M470 790 C 500 772, 560 772, 590 790 C 560 806, 500 806, 470 790 Z" fill="#C2A66A"/>
  <path d="M478 792 C 506 780, 556 780, 584 793 C 556 803, 506 803, 478 792 Z" fill="#E9DAA9"/>
  <path d="M960 800 C 990 784, 1040 784, 1070 800 C 1040 814, 990 814, 960 800 Z" fill="#C2A66A"/>
  <path d="M968 802 C 994 792, 1036 792, 1062 803 C 1036 812, 994 812, 968 802 Z" fill="#E9DAA9"/>

  <!-- Flag, catching the wind off the sea -->
  <g transform="translate(820 768)">
    <ellipse cx="0" cy="2" rx="9" ry="3" fill="#3E4A3A"/>
    <rect x="-2" y="-170" width="4" height="172" fill="#F4F0E6"/>
    <path d="M2 -170 C 30 -166, 50 -158, 78 -152 C 54 -142, 30 -136, 2 -132 Z" fill="#C9971A"/>
  </g>

  <!-- Golfer at the top of the backswing, on the dune -->
  <g transform="translate(330 712)" fill="#24303A">
    <ellipse cx="6" cy="44" rx="34" ry="6" fill="#5D6A35" opacity="0.6"/>
    <path d="M-12 44 L-4 6 L4 6 L-2 44 Z"/>
    <path d="M10 44 L6 6 L14 6 L20 44 Z"/>
    <path d="M-8 8 C -10 -14, -6 -36, 4 -40 C 14 -38, 18 -16, 16 8 Z"/>
    <circle cx="6" cy="-50" r="9"/>
    <path d="M-3 -54 C 0 -63, 14 -63, 17 -54 Z"/>
    <path d="M2 -34 C 20 -46, 30 -62, 34 -72 L40 -70 C 36 -58, 26 -40, 8 -28 Z"/>
    <path d="M36 -72 L-34 -116" stroke="#24303A" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <!-- Marram grass in the foreground -->
  <g stroke="#5D6A35" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M60 900 C 64 860, 70 830, 86 800"/><path d="M70 900 C 70 860, 58 830, 40 806"/>
    <path d="M84 900 C 90 870, 104 846, 122 828"/><path d="M96 900 C 98 866, 92 838, 80 812"/>
    <path d="M1180 900 C 1184 860, 1196 836, 1214 812"/><path d="M1192 900 C 1190 864, 1176 836, 1158 818"/>
    <path d="M1206 900 C 1214 872, 1228 852, 1250 836"/><path d="M1220 900 C 1222 870, 1240 846, 1262 832"/>
  </g>
  <g stroke="#7C8A45" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M110 900 C 116 876, 128 858, 146 846"/><path d="M1166 900 C 1160 874, 1146 856, 1128 846"/>
  </g>

  <!-- Gulls -->
  <g stroke="#2F3B4A" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M610 360 q 10 -9 20 0 q 10 -9 20 0"/>
    <path d="M680 392 q 7 -6 14 0 q 7 -6 14 0"/>
    <path d="M560 405 q 6 -5 12 0 q 6 -5 12 0"/>
  </g>

  <rect width="1290" height="900" filter="url(#grain)"/>
</svg>
