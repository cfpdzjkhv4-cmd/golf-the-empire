<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Golf: The Empire, prototype 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=Libre+Caslon+Text:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4EAE1; --panel:#F6F8F3; --ink:#17283A; --muted:#5A6B61; --line:#C8D2C4;
  --club:#245C37; --clubink:#FFFFFF; --flag:#F2C230; --booth:#17283A; --boothink:#F1F3EC; --warn:#B3261E;
  --sea:#B5D2E4; --land:#EEF2E7; --coast:#8EAFC5; --mapink:#4A5A63;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1813; --panel:#17231C; --ink:#E5ECE6; --muted:#91A297; --line:#2A3A30;
    --club:#5FA873; --clubink:#0F1813; --booth:#0A1220; --warn:#FF8A80;
    --sea:#12283A; --land:#1E2C24; --coast:#2E4A5E; --mapink:#9FB0A6;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1813; --panel:#17231C; --ink:#E5ECE6; --muted:#91A297; --line:#2A3A30;
  --club:#5FA873; --clubink:#0F1813; --booth:#0A1220; --warn:#FF8A80;
  --sea:#12283A; --land:#1E2C24; --coast:#2E4A5E; --mapink:#9FB0A6;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.35;
  -webkit-tap-highlight-color:transparent;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;flex-wrap:wrap;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;font-weight:700;margin:0;margin-right:auto;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;min-width:0}
header h1 span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat{font-size:14px;color:var(--muted);white-space:nowrap}
.stat b{color:var(--ink);font-weight:600}
.stat.neg b{color:var(--warn)}
.view{flex:1;min-height:0;display:flex;flex-direction:column}
.view[hidden]{display:none}
button{font:inherit;font-size:14px;font-weight:600;color:var(--ink);background:transparent;
  border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer;white-space:nowrap}
button.on,button.primary{background:var(--club);color:var(--clubink);border-color:var(--club)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
button.small{padding:4px 10px;font-size:13px}

/* map */
#mapView{position:relative;overflow:hidden;background:var(--sea)}
#gb{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
#gb .landp{fill:var(--land);stroke:var(--coast);stroke-width:1.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#gb .city{fill:var(--mapink)}
#gb text{font-family:Archivo,"Helvetica Neue",Arial,sans-serif}
#gb .ctext{fill:var(--mapink)}
#gb .pin{cursor:pointer}
#gb .pin .body{fill:#fff;stroke:#245C37;vector-effect:non-scaling-stroke;stroke-width:2}
#gb .pin .dot{fill:#245C37}
#gb .pin.owned .body{fill:#F2C230;stroke:#17283A}
#gb .pin.owned .dot{fill:#17283A}
#gb .pin.sel .body{stroke-width:3}
#gb .plabel{font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round}
.mapctl{position:absolute;display:flex;gap:6px;flex-direction:column}
.mapctl button{background:var(--panel);width:40px;height:40px;padding:0;font-size:20px;line-height:1;box-shadow:0 1px 4px rgba(0,0,0,.2)}
#zoomCtl{right:12px;top:12px}
#mineBtn{position:absolute;left:12px;top:12px;background:var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.legend{position:absolute;left:12px;top:56px;font-size:12px;color:var(--mapink);line-height:1.6}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.sheet{position:absolute;left:8px;right:8px;bottom:8px;background:var(--panel);border-radius:12px;padding:14px 16px;
  box-shadow:0 8px 28px rgba(0,0,0,.28);max-width:460px;margin:0 auto;max-height:72%;overflow:auto}
.sheet[hidden]{display:none}
.sheet h2{font-size:20px;margin:0;letter-spacing:-.01em}
.sheet .area{color:var(--muted);margin:2px 0 8px}
.sheet .price{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:6px 0}
.sheet .desc{margin:0 0 10px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:14px;margin:0 0 12px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;font-weight:600}
.sheet .close{position:absolute;right:10px;top:10px}
.mine{border-top:1px solid var(--line);padding:9px 0;display:flex;align-items:center;gap:10px}
.mine:first-of-type{border-top:0}
.mine div{flex:1;min-width:0}
.mine small{color:var(--muted);display:block}

/* course */
.holes{display:flex;gap:5px;overflow-x:auto;padding:8px 10px 2px;scrollbar-width:none;flex:none}
.holes::-webkit-scrollbar{display:none}
.holes button{display:flex;flex-direction:column;align-items:center;padding:4px 9px;border-radius:8px;min-width:44px;line-height:1.15}
.holes button small{font-size:11px;font-weight:400;opacity:.8}
.holes button.empty{border-style:dashed}
.cmain{flex:1;min-height:0;display:flex;flex-direction:column}
#mapwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 10px 0}
canvas{display:block;border-radius:6px;touch-action:none;box-shadow:0 0 0 1px var(--line)}
aside{flex:none;display:flex;flex-direction:column}
.booth{background:var(--booth);color:var(--boothink);margin:8px 10px 0;border-radius:6px;
  padding:9px 14px 10px;border-left:4px solid var(--flag);min-height:80px}
.booth small{display:block;font-size:12px;opacity:.65;margin-bottom:3px}
.booth p{margin:0;font-family:"Libre Caslon Text",Georgia,serif;font-style:italic;font-size:16px;line-height:1.45}
.booth .prev{font-size:13px;opacity:.5;margin-top:4px}
.tabs{display:flex;gap:4px;padding:8px 10px 0}
.tabs button{flex:1}
.panel{background:var(--panel);margin:8px 10px 10px;border-radius:6px;padding:10px;box-shadow:0 0 0 1px var(--line);min-height:120px}
.panel[hidden]{display:none}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tools{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tools button{display:flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.info{font-size:13px;color:var(--muted);margin:8px 2px}
.info b{color:var(--ink);font-weight:600}
.rev{border-top:1px solid var(--line);padding:7px 2px}
.rev:first-child{border-top:0}
.rev .stars{color:#C9971A;letter-spacing:1px}
.rev q{display:block;font-family:"Libre Caslon Text",Georgia,serif;font-style:italic;font-size:14px;margin-top:2px}
.reviews{max-height:170px;overflow-y:auto}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 60px);transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;max-width:92%;text-align:center}
#toast.show{opacity:1}

.tabs button{padding:6px 4px;font-size:13px}
#gb .pin.admin .body{fill:#E8604C;stroke:#7A1E12}
#gb .pin.admin .dot{fill:#fff}
#gb .pin.fresh .body{stroke:#C9971A}
#ticker{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:9px 14px;font-size:13px;
  display:flex;gap:8px;align-items:center;cursor:pointer}
#ticker b{color:var(--club);white-space:nowrap}
#ticker span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet{bottom:46px}
.legend{top:56px}
.fac{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:8px 2px}
.fac:first-child{border-top:0}
.fac div{flex:1;min-width:0;font-size:14px}
.fac small{display:block;color:var(--muted);font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--club)}
.ev{border-top:1px solid var(--line);padding:9px 2px}
.ev:first-child{border-top:0}
.ev h3{font-size:15px;margin:0 0 2px;display:flex;justify-content:space-between;gap:8px}
.ev ul{list-style:none;margin:4px 0 6px;padding:0;font-size:13px;color:var(--muted)}
.ev li.ok{color:var(--club)}
.ev li::before{content:"\2717  ";color:var(--warn)}
.ev li.ok::before{content:"\2713  ";color:var(--club)}
.career li{font-size:14px;color:var(--muted)}
.scroll{max-height:230px;overflow-y:auto}
@media (min-width:760px){.scroll{max-height:none}}
@media (min-width:760px){
  .cmain{flex-direction:row}
  #mapwrap{padding:6px 0 12px 14px}
  aside{width:370px;overflow-y:auto}
  .reviews{max-height:none}
}

.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:#fff;font-size:11px;line-height:18px;text-align:center;margin-left:2px}
.badge[hidden]{display:none}
#goal{display:flex;gap:8px;align-items:center;padding:6px 12px;background:var(--booth);color:var(--boothink);font-size:13px;cursor:pointer;border-bottom:2px solid var(--flag)}
#goal[hidden]{display:none}
#goal b{white-space:nowrap}
#goal span{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#modal{position:fixed;inset:0;background:rgba(8,18,12,.55);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 10px calc(env(safe-area-inset-bottom,0px) + 12px)}
#modal[hidden]{display:none}
#modalBox{background:var(--panel);border-radius:14px;width:100%;max-width:520px;max-height:100%;overflow:auto;padding:16px 16px 18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.mhead h2{margin:0;font-size:20px}
.mailrow{display:flex;flex-direction:column;align-items:stretch;text-align:left;width:100%;border-radius:10px;padding:9px 12px;margin-top:6px;white-space:normal;font-weight:400}
.mailrow .mfrom{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.mailrow .mtitle{font-size:15px;margin-top:1px}
.mailrow.unread{border-color:var(--club);box-shadow:inset 3px 0 0 var(--club)}
.mailrow.unread .mtitle{font-weight:700}
.mail>small{color:var(--muted)}
.mail h2{font-family:"Libre Caslon Text",Georgia,serif;font-style:italic;font-size:22px;line-height:1.25;margin:4px 0 8px;font-weight:400}
.mail h4{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--club);margin:16px 0 4px}
.mail p{margin:0 0 9px}
.mail .kick,.mail .byline{color:var(--muted);font-size:13px}
.mail .score{font-size:24px;font-weight:700;color:var(--club)}
.percy{font-family:"Libre Caslon Text",Georgia,serif;font-style:italic}
.opp{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding:8px 0}
.opp div{flex:1;min-width:0}
.opp small{display:block;color:var(--muted)}
.start{text-align:center;display:flex;flex-direction:column;gap:9px}
.start .hero{width:100%;height:auto;border-radius:10px}
.start h1{font-family:"Libre Caslon Text",Georgia,serif;font-style:italic;font-weight:400;font-size:34px;margin:4px 0 0;letter-spacing:-.01em}
.start .sub{color:var(--muted);margin:0 0 4px}
button.big{display:flex;flex-direction:column;align-items:center;padding:11px 14px;border-radius:12px;font-size:16px;white-space:normal}
button.big small{font-weight:400;font-size:13px;opacity:.8;margin-top:2px}
.scen{border-top:1px solid var(--line);padding:10px 0}
.scen h3{display:flex;justify-content:space-between;gap:8px;margin:0 0 4px;font-size:16px;align-items:baseline}
.scen h3 small{color:var(--muted);font-weight:400;font-size:12px;white-space:nowrap}
.scen p{margin:0 0 6px;font-size:14px}
.offer{display:flex;align-items:center;gap:12px;margin:6px 0}
.offer b{font-size:22px;min-width:120px;text-align:center}
.offer button{width:40px;height:40px;padding:0;font-size:20px}
.auc h2{margin:2px 0 4px}
.auc>small{color:var(--muted)}
.aucbid{background:var(--booth);color:var(--boothink);border-radius:10px;padding:12px;margin:8px 0;text-align:center}
.aucbid span{display:block;font-size:32px;font-weight:700;letter-spacing:-.02em}
.aucbid small{opacity:.75}
.gavel{text-align:center;font-weight:700;color:var(--warn);font-size:18px;min-height:24px;text-transform:uppercase;letter-spacing:.08em}
.alog{min-height:120px}
.alog p{margin:4px 0;font-family:"Libre Caslon Text",Georgia,serif;font-style:italic}
.alog p.old{opacity:.5;font-size:13px}
.abtns{display:flex;gap:8px;flex-wrap:wrap}
.abtns .big1{flex:1;padding:12px;font-size:16px}
#gb .pin.rival .dot{fill:#fff}
#gb .pin.rival .body{stroke:#fff}
#gb .pin.live .body{stroke:#C9971A;stroke-width:3}
.legend{background:color-mix(in srgb,var(--sea) 70%,transparent);border-radius:6px;padding:2px 6px}
header{gap:8px;padding:7px 10px}
@media (max-width:759px){
  .stat{font-size:13px}
  #mapwrap{flex:0 0 58%;min-height:0}
  aside{flex:1 1 0;min-height:0;overflow-y:auto}
  .booth{min-height:0;padding:7px 12px 8px}
  .booth p{font-size:15px}
  .booth .prev{display:none}
  .scroll{max-height:none}
}
#speed.held{opacity:.6;border-style:dashed}

.hcard{display:flex;gap:10px;align-items:flex-start;margin-top:8px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.hrate{flex:none;width:46px;height:46px;border-radius:10px;color:#fff;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center}
.hbody{min-width:0}
.hbody small{display:block;color:var(--muted);margin-top:4px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:11px;padding:2px 7px;border-radius:9px;background:color-mix(in srgb,var(--club) 15%,transparent);color:var(--club);font-weight:600}
.chip.bad{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.chip.sig{background:#B8860B;color:#fff}
.holes button i.hs{display:block;font-style:normal;font-weight:700;font-size:11px}
.books h2{margin:0 0 6px}
.books table{width:100%;border-collapse:collapse;font-size:14px}
.books td{padding:3px 0}
.books td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.books tr.sec td{padding-top:10px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--club);font-weight:700}
.books tr.tot td{border-top:1px solid var(--line);font-weight:700}
.books tr.net td{border-top:2px solid var(--ink);font-weight:700;font-size:16px;padding-top:6px}
.up{color:#2E7D4F}.down{color:var(--warn)}
.books h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--club);margin:14px 0 4px}
.bc{display:flex;gap:8px;align-items:center;border-top:1px solid var(--line);padding:6px 0}
.bc div{flex:1;min-width:0}.bc small{display:block;color:var(--muted)}.bc span{font-weight:700}
.auto{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin:12px 0 8px}
.books .big{width:100%}
.sell{border-top:1px solid var(--line);margin-top:12px;padding-top:8px}
.sell h3{margin:0 0 4px;font-size:15px}
#gb .pin.private .body{fill:#2B3A55;stroke:#C9971A;stroke-width:2}
#gb .pin.private .dot{fill:#C9971A}
#gb .pin.legend .body{stroke:#C9971A;stroke-width:2.5}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><button id="back" class="small" hidden>Map</button><span id="title">Golf: The Empire</span></h1>
    <span class="stat" id="sCash">Cash <b>£200,000</b></span>
    <span class="stat"><b id="sDay">Day 1, 07:00</b></span>
    <button id="speed" class="small">1x</button>
    <button id="inboxBtn" class="small" aria-label="Inbox">&#9993;<span id="inboxN" class="badge" hidden></span></button>
  </header>
  <div id="goal" hidden></div>

  <section class="view" id="mapView">
    <svg id="gb" xmlns="http://www.w3.org/2000/svg" aria-label="Map of Great Britain with land for sale"></svg>
    <button id="mineBtn" class="small">My courses</button>
    <div class="legend"><div><i style="background:#fff;box-shadow:inset 0 0 0 2px #245C37"></i>For sale</div><div><i style="background:#fff;box-shadow:inset 0 0 0 2px #C9971A"></i>Live auction</div><div><i style="background:#E8604C"></i>Administration</div><div><i style="background:#F2C230;box-shadow:inset 0 0 0 2px #17283A"></i>Yours</div><div><i style="background:linear-gradient(90deg,#6A55A8 33%,#9A5B26 33% 66%,#55636B 66%)"></i>Rivals</div><div><i style="background:#2B3A55;box-shadow:inset 0 0 0 2px #C9971A"></i>Legendary</div></div>
    <div class="mapctl" id="zoomCtl"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">&minus;</button></div>
    <div class="sheet" id="sheet" hidden></div>
    <div id="ticker"><b>Golf Gazette</b><span id="tickText">Land for sale across Britain. Tap a pin.</span></div>
  </section>

  <section class="view" id="courseView" hidden>
    <div class="holes" id="holes"></div>
    <div class="cmain">
      <div id="mapwrap"><canvas id="map" aria-label="Hole layout"></canvas></div>
      <aside>
        <div class="booth" aria-live="polite">
          <small>Percy Hollis, on commentary</small>
          <p id="line"></p>
          <p class="prev" id="prev"></p>
        </div>
        <div class="tabs">
          <button data-tab="build" class="on">Build</button>
          <button data-tab="run">Run</button>
          <button data-tab="club">Club</button>
          <button data-tab="events">Events</button>
          <button data-tab="reviews">Reviews</button>
        </div>
        <div class="panel" id="pBuild">
          <div class="tools" id="tools"></div>
          <div class="info" id="buildInfo"></div>
          <div class="row">
            <button id="auto">Auto layout this hole</button>
            <button id="autoAll">Auto layout empty holes</button>
            <button id="brush">Brush: small</button>
            <button id="clearHole">Clear hole</button>
          </div>
        </div>
        <div class="panel" id="pRun" hidden>
          <div class="row">
            <button id="openBtn" class="primary">Open course</button>
            <button id="watchBtn">Watch a round</button>
          </div>
          <div class="row" style="margin-top:8px">
            <span class="stat">Green fee <b id="fee">£25</b></span>
            <button id="feeDown" class="small">Lower</button>
            <button id="feeUp" class="small">Raise</button>
          </div>
          <div class="info" id="runInfo"></div>
        </div>
        <div class="panel" id="pClub" hidden><div class="scroll" id="clubList"></div></div>
        <div class="panel" id="pEvents" hidden><div class="scroll" id="evList"></div></div>
        <div class="panel" id="pReviews" hidden>
          <div class="info" id="revSummary"></div>
          <div class="reviews" id="revList"></div>
        </div>
      </aside>
    </div>
  </section>
</div>
<div id="toast"></div>
<div id="modal" hidden><div id="modalBox"></div></div>
<script>
(function(){
const COLS=16, ROWS=32, YPC=17, KEY='links-tycoon-v2';
const T={ROUGH:0,FAIRWAY:1,GREEN:2,BUNKER:3,WATER:4,TREES:5,TEE:6};const SEA=7;
const COST={0:5,1:15,2:60,3:30,4:80,5:20,6:150};
const TOOLS=[
  {id:'fairway',t:1,name:'Fairway'},{id:'green',t:2,name:'Green'},{id:'bunker',t:3,name:'Bunker'},
  {id:'water',t:4,name:'Water'},{id:'trees',t:5,name:'Trees'},{id:'rough',t:0,name:'Clear to rough'},

function baseGrid(terrain){
  const g=new Array(COLS*ROWS).fill(0);
  const blob=(t,cx,cy,r,p)=>{for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){const d=Math.hypot(x-cx,y-cy);if(d<r&&Math.random()<p-d/r*p*.6)g[idx(x,y)]=t}};
  const edgeX=()=>Math.random()<.5?ri(0,2):ri(13,15);
  if(terrain==='links'){for(let k=0;k<5;k++)blob(T.TREES,edgeX(),ri(0,31),2,.6);for(let k=0;k<5;k++){const x=edgeX(),y=ri(0,31);g[idx(x,y)]=T.BUNKER}}
  if(terrain==='heathland'){for(let k=0;k<7;k++)blob(T.TREES,Math.random()*COLS,Math.random()*ROWS,3.2,.8)}
  if(terrain==='parkland'){for(let i=0;i<g.length;i++)if(Math.random()<.07)g[i]=T.TREES;for(let k=0;k<3;k++)blob(T.TREES,edgeX(),ri(0,31),2.5,.8)}
  if(terrain==='moorland'){for(let i=0;i<g.length;i++)if(Math.random()<.025)g[i]=T.TREES;blob(T.WATER,edgeX(),ri(4,28),1.8,1)}
  return g;
}

function tAt(H,p){const x=Math.floor(p.x),y=Math.floor(p.y);return inb(x,y)?H.g[idx(x,y)]:-1}

function courseIssue(C){for(let i=0;i<C.holes.length;i++){const e=holeIssue(C.holes[i]);if(e)return 'Hole '+(i+1)+' '+e}return null}

function fairFee(C){const P=PL[C.plotId];return (20+C.rep*7)*P.wealth*(P.holes===18?1.6:1)*(.8+quality(C).design*.045)}
const WXD={sun:1.15,cloud:1,rain:.55,wind:.85,storm:.15};
function wfOf(C){return C.wx==='storm'?1.6:C.wx==='wind'?1.35:1}
function buzzM(C){return C.buzz&&S.day<=C.buzz.until?C.buzz.m:1}
function rate(C){const P=PL[C.plotId];return P.demand*3*(.5+C.rep/5)*clamp(1.5-(C.fee/fairFee(C))*.6,.15,1.5)*WXD[C.wx]*(C.fac.range?1.1:1)*(C._comp??(C._comp=comp(C)))*buzzM(C)*(.75+quality(C).design*.06)*seasonM()*weekdayM()}

function makeGolfer(C){

function planShot(H,g,pos){

}
function execute(H,g,pos,plan,wf){wf=wf||1;

  if(Math.random()<.05*(1-g.skill))ang+=(Math.random()<.5?-1:1)*(.35+Math.random()*.3);
  const carry=Math.max(5,plan.d*(1+gauss()*(.04+.1*(1-g.skill))*le*wf));

function review(C,g,res){
  const P=PL[C.plotId],q=quality(C),n=C.holes.length,over=(res.total-q.par)/n;
  const f=[['design',(q.design-5)*.34],['pretty',q.beauty*.6],['variety',q.variety],['setting',(P.prestige-1)*.6],
    ['score',over<=0?.6:over<.6?.2:over<1.2?0:over<2?-.4:-.8],['pens',-Math.min(1.2,res.pens*.25)]];

    rain:["Got drenched. Not the course's fault, I suppose."],
    design:["Brilliant design. Every hole asks a question.","Proper architecture, this. Loved every hole."],designN:["Every hole looks the same.","Dull layout. Nothing to think about all day."],
    meh:["Pleasant enough. Bit forgettable.","Fine. Nothing special."]};

function finishRound(C,g,res){

/* ---------- market ---------- */
function priceOf(id){return Math.round(PL[id].price*(S.market.mult[id]||1)/1000)*1000}
function adminPrice(id){return Math.round((priceOf(id)*1.1+PL[id].holes*2400)/1000)*1000}
function marketDay(){
  const M=S.market;
  PLOTS.forEach(p=>{if(S.courses[p.id]||S.rc[p.id])return;M.mult[p.id]=clamp((M.mult[p.id]||1)*(1+gauss()*.015),.8,1.35)});
  for(const id in M.fresh)if(M.fresh[id]<S.day-4)delete M.fresh[id];
  for(const id of Object.keys(M.sales)){const s=M.sales[id];if(s.type!=='quiet'&&s.closes<S.day)resolveSale(id)}
  for(const id in M.sales){const s=M.sales[id];if(s.type==='live'&&s.closes===S.day){news('Live auction today: '+PL[id].name+', guide '+money(s.guide)+'. Tap the pin to attend.');toast('Live auction today at '+PL[id].name+'. Tap its pin to attend.',4500)}}
  const free=()=>PLOTS.filter(p=>!S.courses[p.id]&&!S.rc[p.id]&&!M.sales[p.id]);
  if(S.day>=M.nextNew){const pool=free();if(pool.length){const p=rnd(pool),sl=newSale(p.id,false);news('New to market. '+saleNews(p.id,sl))}M.nextNew=S.day+ri(4,8)}
  if(S.day>=M.nextAdmin){const pool=free();if(pool.length){const p=rnd(pool),sl=newSale(p.id,true,6);news(p.name+' golf club goes into administration. '+saleNews(p.id,sl))}M.nextAdmin=S.day+ri(12,20)}
}

/* ---------- clock ---------- */
function minuteTick(){
  for(const id in S.courses){const C=S.courses[id];if(!C.open||(C.booked&&C.booked.day===S.day))continue;
    if(C.mem.on&&C.mem.n&&S.min-(C._last??-99)>=8&&Math.random()<C.mem.n/memCap(C)*(S.min<660?4:1.3)/60){C._last=S.min;const n=ri(2,4);for(let k=0;k<n;k++)headlessRound(C,true);continue}
    if(Math.random()<rate(C)/60){
      if(S.min-(C._last??-99)<8)C.today.walked++;
      else{C._last=S.min;const n=1+Math.floor(Math.random()*4);for(let k=0;k<n;k++)headlessRound(C)}
    }}
}
function endDay(){
  let rounds=0,rev=0,up=0;
  for(const id in S.courses){const C=S.courses[id];
    if(C.booked&&C.booked.day===S.day){const E=EVENTS.find(e=>e.id===C.booked.id);C.booked=null;runEvent(C,E)}
    stormDay(C);
    const mi=memDay(C);S.cash+=mi;C.today.rev+=mi;C.today.mem=mi;
    const u=C.open||C.rounds||C.mem.on?upkeep(C):0;S.cash-=u;up+=u;rounds+=C.today.rounds;rev+=C.today.rev;S.wk.profit+=C.today.rev-u;
    C.lastDay={...C.today,up:u};if(C.today.rev-u>=2000)achieve('profit');
    C.cond=clamp(C.cond+[0,3,7,12][C.fac.staff]-(C.wx==='rain'?3:C.wx==='storm'?6:0),20,100);
    C.today={rounds:0,rev:0,walked:0,memR:0,vis:0,mem:0};C._last=-99;C._comp=null;C.wx=rollWx(PL[id]);C.holes.forEach(H=>H._ground=null)}
  if(Object.keys(S.courses).length)toast('Day '+S.day+' done. '+rounds+' rounds, '+money(rev)+' in, '+money(up)+' upkeep.',3500);
  S.day++;S.min=420;marketDay();rivalsDay();featureDue();if(S.day%7===0)gazette();checkCareer();
  if(R.view==='course'){const C=course();say('wx_'+C.wx);renderHoles();refreshPanels()}
  if(R.view==='map')renderOverlay();
  badge();save();checkScen();
}
function update(dt){
  R.t+=dt/1000;
  if(R.auc)stepAuction(dt);
  if(!S.speed||R.hold||menuOpen())return;
  const before=S.min;S.min=Math.min(1140,S.min+dt/1000*10*S.speed);
  const mins=Math.floor(S.min)-Math.floor(before);
  for(let i=0;i<mins;i++)minuteTick();
  if(S.min>=1140)endDay();
  const sp=Math.max(1,Math.min(S.speed,4));
  if(R.watch)stepWatch(dt*sp);
  if(R.view==='course')stepAmbient(dt*sp/1000);
}

/* ---------- watching a round ---------- */
function course(){return S.courses[R.cid]}
function hole(){return course().holes[R.hole]}
function fill(s,o){return s.replace(/\{(\w+)\}/g,(m,k)=>o&&o[k]!==undefined?o[k]:m)}
function say(key,o){sayText(fill(pick(key),o))}
function sayText(t){R.lines.unshift(t);if(R.lines.length>3)R.lines.length=3;$('#line').textContent=R.lines[0];$('#prev').textContent=R.lines[1]||''}
const SHIRTS=['#D94F3D','#2F6DB5','#F2C230','#7B4FA8','#E58A2E','#2A9D8F','#EDEDED','#C2417A','#3D405B'];
function startWatch(){
  const C=course(),e=courseIssue(C);if(e){toast(e);return}
  if(C.booked&&C.booked.day===S.day){toast('The course is closed for an event today');return}
  const g=makeGolfer(C);g.shirt=rnd(SHIRTS);chargeFee(C);
  const H=C.holes[0],p=center(H.tee);
  R.watch={C,g,hi:0,pos:p,gp:{x:p.x-.35,y:p.y+.15},hs:0,total:0,pens:0,trail:[p],phase:'wait',wait:1400,segs:[],holeDone:false,queue:[]};
  R.hole=0;say('arrive',g);renderHoles();resize();hud();
}
function stepWatch(dt){
  const w=R.watch,C=w.C,H=C.holes[w.hi];
  if(w.phase==='walk'){
    const dx=w.to.x-w.gp.x,dy=w.to.y-w.gp.y,d=Math.hypot(dx,dy),st=2.6*dt/1000;w.walkT=(w.walkT||0)+dt;
    if(d<=st||d>14){w.gp={...w.to};w.phase='wait';w.wait=w.holeDone?900:650}else{w.gp.x+=dx/d*st;w.gp.y+=dy/d*st}
    return;
  }
  if(w.phase==='wait'){
    w.wait-=dt;if(w.wait>0)return;
    if(w.queue.length){sayText(w.queue.shift());w.wait=1300;return}
    if(w.holeDone){
      if(w.hi+1<C.holes.length){
        w.hi++;const N=C.holes[w.hi],p=center(N.tee);w.pos=p;w.gp={x:p.x-.35,y:p.y+.15};w.trail=[p];w.hs=0;w.holeDone=false;w.res=null;
        if(R.view==='course'&&R.cid===C.plotId){R.hole=w.hi;renderHoles();resize();hud()}
        say('nexthole',{n:ORD(w.hi+1),yd:Math.round(holeYards(N)),p:holePar(N)});w.wait=1300;return;
      }
      finishRound(C,w.g,{total:w.total,pens:w.pens});
      say('roundend',{total:w.total,rel:relText(w.total-quality(C).par)});
      R.watch=null;renderReviews();hud();return;
    }
    w.res=execute(H,w.g,w.pos,planShot(H,w.g,w.pos),wfOf(C));w.segs=w.res.segs;w.hs++;w.phase='anim';return;
  }
  const s=w.segs[0];s.t+=dt;if(s.t<s.dur)return;w.segs.shift();if(w.segs.length)return;
  const r=w.res,p=holePar(H);w.hs+=r.pen;w.pens+=r.pen;w.pos=r.newPos;w.trail.push(r.newPos);
  if(r.holed){
    say(w.hs===1?'ace':r.ev);const sc=Math.min(w.hs,p+4),rel=sc-p;w.total+=sc;w.holeDone=true;
    if(w.hs>1)w.queue.push(pick(rel<=-2?'eagle':rel===-1?'birdie':rel===0?'par':rel===1?'bogey':'double'));
  }else{say(r.ev);if(w.hs>=10){w.total+=p+4;w.holeDone=true;w.queue.push(pick('pickup'))}}
  w.to={x:w.pos.x-.35,y:w.pos.y+.12};w.phase='walk';w.walkT=0;
}

/* ---------- ambient golfers ---------- */
function stepAmbient(ds){
  const C=course(),H=hole();
  const want=C.open&&!courseIssue(C)?Math.min(5,Math.round(rate(C)*.9)+(C.booked&&C.booked.day===S.day?3:0)):0;
  if(R.ambKey!==R.cid+':'+R.hole){R.amb=[];R.ambKey=R.cid+':'+R.hole}
  if(!H.tee||!H.pin)return;
  while(R.amb.length<want)R.amb.push(newAmb(H,R.amb.length===0&&!R.ambSeeded?Math.random():Math.random()*.6));
  R.ambSeeded=true;
  for(let i=R.amb.length-1;i>=0;i--){const a=R.amb[i];
    if(a.wait>0){a.wait-=ds;a.swing=a.wait<.5&&a.wait>0&&a.stopShot;continue}
    const t=a.path[a.i];if(!t){R.amb.splice(i,1);continue}
    const dx=t.x-a.x,dy=t.y-a.y,d=Math.hypot(dx,dy),st=1.6*ds;a.walking=true;a.ph+=ds*9;
    if(d<=st){a.x=t.x;a.y=t.y;a.i++;a.walking=false;a.wait=1.2+Math.random()*2.2;a.stopShot=true}else{a.x+=dx/d*st;a.y+=dy/d*st}
    if(a.i>=a.path.length&&a.wait<=0)R.amb.splice(i,1);
  }
  if(R.amb.length>want)R.amb.length=want;
}
function newAmb(H,prog){
  const a=center(H.tee),b=center(H.pin),path=[];
  for(const f of [.35,.62,.85,.97,1.02]){path.push({x:a.x+(b.x-a.x)*f+(Math.random()-.5)*2.2*(1-f*.8),y:a.y+(b.y-a.y)*f+(Math.random()-.5)*1.2})}
  const k=Math.floor(prog*path.length),st=k?path[k-1]:{x:a.x-.3,y:a.y+.2};
  return {x:st.x,y:st.y,path,i:k,wait:Math.random()*2,ph:Math.random()*6,shirt:rnd(SHIRTS),walking:false};
}

function cellFrom(e){const r=cv.getBoundingClientRect();return {x:Math.floor((e.clientX-r.left)/cs),y:Math.floor((e.clientY-r.top)/cs)}}
function paint(cell,first){
  if(R.tab!=='build'||R.view!=='course')return;
  if(R.watch&&R.watch.C===course()){if(first)blocked();return}
  const key=cell.x+','+cell.y;if(!first&&key===R.lastCell)return;R.lastCell=key;
  if(!inb(cell.x,cell.y))return;
  const C=course(),H=hole();
  if(H.g[idx(cell.x,cell.y)]===SEA){if(first)toast('That is the sea now');return}
  if(tool.id==='pin'){if(!first)return;if(H.g[idx(cell.x,cell.y)]!==T.GREEN){toast('Place the pin on a green');return}H.pin={x:cell.x,y:cell.y};H.lostGreen=false;dirty(C,H);renderHoles();hud();return}
  if(tool.id==='tee'){if(!first)return;if(H.tee&&H.tee.x===cell.x&&H.tee.y===cell.y)return;
    if(S.cash<COST[6]){toast('Not enough cash');return}
    if(H.tee)H.g[idx(H.tee.x,H.tee.y)]=T.ROUGH;if(H.pin&&H.pin.x===cell.x&&H.pin.y===cell.y)H.pin=null;
    H.g[idx(cell.x,cell.y)]=T.TEE;H.tee={x:cell.x,y:cell.y};spend('build',COST[6]);dirty(C,H);renderHoles();hud();return}
  const r=brush===1?0:1;let changed=false;
  for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){const x=cell.x+i,y=cell.y+j;if(!inb(x,y))continue;
    const k=idx(x,y);if(H.g[k]===tool.t||H.g[k]===SEA)continue;
    if(S.cash<COST[tool.t]){toast('Not enough cash');break}
    if(H.tee&&H.tee.x===x&&H.tee.y===y)H.tee=null;
    if(H.pin&&H.pin.x===x&&H.pin.y===y&&tool.t!==T.GREEN)H.pin=null;
    H.g[k]=tool.t;spend('build',COST[tool.t]);changed=true;C._edits=(C._edits||0)+1}
  if(changed){dirty(C,H);renderHoles();hud()}
}
function layoutCost(H,n){let c=0;for(let i=0;i<n.g.length;i++)if(n.g[i]!==H.g[i])c+=n.g[i]===T.TEE?COST[6]:COST[n.g[i]];return c}

function parFor(C,i){return (C.holes.length===18?PARS18:PARS9)[i]}
function autoHole(){

  sayText('Hole '+(R.hole+1)+' laid out for '+money(c)+'. A par '+holePar(hole())+' of '+Math.round(holeYards(hole()))+' yards. Tinker away.');

function autoAll(){

/* ---------- v4: rivals ---------- */
const RIV={
 meridian:{name:'Meridian Capital',short:'Meridian',col:'#6A55A8',blurb:'A cash rich consortium buying up the home counties. Pays over the odds for prestige.',cash:1200000,bid:[1.05,1.4],target:4.3,max:5,
   want:(P,g)=>P.wealth>=1.2||P.prestige>=1.45},
 hollingworth:{name:'Hollingworth Estates',short:'Hollingworth',col:'#9A5B26',blurb:'Old money. Northern and Scottish clubs, and fiercely protective of their patch.',cash:700000,bid:[.95,1.25],target:4.1,max:4,
   want:(P,g)=>P.lat>=54||(P.terrain==='links'&&P.prestige>=1.4)},
 granite:{name:'Granite Leisure',short:'Granite',col:'#55636B',blurb:'A budget chain. Cheap nine holers and cheaper burgers.',cash:400000,bid:[.9,1.1],target:3.0,max:5,
   want:(P,g)=>g<=120000&&(P.holes===9||g<=80000)}
};
const RIVAL_START={meridian:['harpenden'],hollingworth:['irvine'],granite:['peak','sutton']};
function rivalCount(k){return Object.values(S.rc).filter(x=>x.o===k).length}
function initWorld(){
  S.rivals=S.rivals||{};for(const k in RIV)if(!S.rivals[k])S.rivals[k]={cash:RIV[k].cash};
  S.rc=S.rc||{};
  for(const k in RIVAL_START)RIVAL_START[k].forEach(id=>{if(!S.courses[id]&&!S.rc[id])S.rc[id]={o:k,rep:RIV[k].target-.4+Math.random()*.3,day:0}});
  shuffle(PLOTS.filter(p=>!p.legend&&!RESERVE.includes(p.id)&&!S.rc[p.id]&&!S.courses[p.id]&&!S.market.sales[p.id])).sort((a,b)=>(b.gen?1:0)-(a.gen?1:0)).slice(0,14).forEach(p=>newSale(p.id,false,ri(4,18)));ensureStarter();
  const sl=Object.values(S.market.sales);if(!sl.some(x=>x.type==='live'&&x.closes<=6)){const c=Object.keys(S.market.sales).filter(id=>S.market.sales[id].type==='sealed');
    if(c.length){const x=S.market.sales[rnd(c)];x.type='live';x.closes=S.day+ri(3,5)}}
  for(const id in S.market.fresh)delete S.market.fresh[id];
}
function comp(C){const P=PL[C.plotId],a=proj(P.lat,P.lon);let f=1;
  for(const id in S.rc){const Q=PL[id],b=proj(Q.lat,Q.lon),d=Math.hypot(a.x-b.x,a.y-b.y);if(d<90)f*=1-.2*(S.rc[id].rep/5)*(1-d/90)}return f}
function rivalsDay(){
  for(const id of Object.keys(S.rc)){const r=S.rc[id],O=RIV[r.o],P=PL[id];
    r.rep=clamp(r.rep+(Math.max(((S.rtgt&&S.rtgt[r.o])||O.target),P.legend?4.6:0)-r.rep)*.04+gauss()*.04,1,5);
    S.rivals[r.o].cash+=(P.holes===18?2600:1200)*P.wealth*(r.rep/4);
    if((r.o==='granite'&&r.rep<3.3&&Math.random()<1/90)||Math.random()<1/450){
      delete S.rc[id];const sl=newSale(id,true,6);news(O.name+' puts '+P.name+' into administration. '+saleNews(id,sl))}
  }
  for(const id of Object.keys(S.market.sales)){const sl=S.market.sales[id];if(sl.type!=='quiet')continue;const g=salePrice(id);
    if(g<=150000&&Math.random()<.025&&rivalCount('granite')<RIV.granite.max&&S.rivals.granite.cash>=g){
      delete S.market.sales[id];S.rivals.granite.cash-=g;S.rc[id]={o:'granite',rep:2.5,day:S.day};
      news('Granite Leisure snaps up '+PL[id].name+' for '+money(g)+'. Expect a burger van by the weekend.')}}
  if(S.day>=S.champNext){const c=Object.keys(S.rc).filter(id=>{const P=PL[id];return P.terrain==='links'&&P.prestige>=1.4&&P.holes===18&&S.rc[id].rep>=4.3});
    if(c.length&&Math.random()<1/20){const id=rnd(c);S.champNext=S.day+45;S.rc[id].rep=clamp(S.rc[id].rep+.2,0,5);
      news('The Championship goes to '+PL[id].name+', owned by '+RIV[S.rc[id].o].name+'. Next slot on the rota in 45 days.')}}
}

/* ---------- auctions ---------- */
function saleType(id,guide,admin){const P=PL[id];
  if(P.holes===18&&((P.prestige>=1.4&&guide>=120000)||(admin&&guide>=150000)))return 'live';
  if(!admin&&guide<90000&&P.prestige<1.3)return 'quiet';
  return Math.random()<.35?'live':'sealed'}
function newSale(id,admin,closeIn){
  const M=S.market,guide=admin?adminPrice(id):priceOf(id),type=saleType(id,guide,admin),int=[],rum=[];
  if(type!=='quiet')for(const k in RIV){const O=RIV[k],w=rivalCount(k)<O.max&&O.want(PL[id],guide,admin)&&Math.random()<.3;if(w)int.push(k);if(w!==(Math.random()<.15))rum.push(k)}
  M.sales[id]={type,guide,admin:!!admin,closes:type==='quiet'?null:S.day+(closeIn||ri(5,9)),mine:null,int,rum};M.fresh[id]=S.day;
  return M.sales[id];
}
function salePrice(id){const sl=S.market.sales[id];if(!sl)return 0;return sl.type==='quiet'?Math.round((sl.admin?adminPrice(id):priceOf(id))*(sl.disc||1)/1000)*1000:sl.guide}
function saleNews(id,sl){const P=PL[id],r=sl.rum.map(k=>RIV[k].short);
  return (sl.type==='live'?'Live auction on '+dTxt(sl.closes,1)+': ':sl.type==='sealed'?'Sealed bids invited: ':'For sale: ')+P.name+', '+P.area+'. '+(sl.type==='quiet'?'Asking ':'Guide ')+money(salePrice(id))+'.'+(r.length?' '+r.join(' and ')+' said to be interested.':'')}
function bidStep(sl){return Math.max(1000,Math.round(sl.guide*.05/1000)*1000)}
function rivalBid(k,sl){const O=RIV[k],b=Math.round(sl.guide*(O.bid[0]+Math.random()*(O.bid[1]-O.bid[0]))/1000)*1000;return Math.min(b,Math.floor(S.rivals[k].cash*(sl.legend?4:1)/1000)*1000)}
function who(k){return k==='you'?'You':k==='private'?'A private buyer':RIV[k].name}
function resolveSale(id,liveBids){
  const M=S.market,sl=M.sales[id];if(!sl)return null;const P=PL[id];let bids=[],note='';
  if(liveBids)bids=liveBids;
  else{sl.int.forEach(k=>{if(rivalCount(k)>=RIV[k].max)return;const b=rivalBid(k,sl);if(b>=sl.guide*.85)bids.push({k,b})});
    if(sl.mine){if(S.cash>=sl.mine)bids.push({k:'you',b:sl.mine});else note='<p>Your offer of '+money(sl.mine)+' was ruled out. You didn\'t have the cash on closing day.</p>'}}
  bids.sort((a,b)=>b.b-a.b||(a.k==='you'?-1:b.k==='you'?1:0));
  const reserve=Math.round(sl.guide*.9/1000)*1000,top=bids[0];delete M.sales[id];
  const table=liveBids?'':(bids.length?'<h4>Sealed bids</h4><p>'+bids.map(x=>who(x.k)+': '+money(x.b)).join('<br>')+'</p><p>Reserve: '+money(reserve)+'.</p>':'<p>No bids came in.</p>');
  if((!top||top.b<reserve)&&sl.legend){news(P.name+' withdrawn. The reserve was not met.');if(R.view==='map')renderOverlay();return null}
  if(!top||top.b<reserve){
    M.sales[id]={type:'quiet',guide:sl.guide,admin:sl.admin,closes:null,mine:null,int:[],rum:[],disc:.88};
    news(P.name+' fails to sell at auction. Now available at '+money(salePrice(id))+' to anyone who wants it.');
    if(sl.mine||liveBids)mail('Auction house','Result: '+P.name,'<p>'+P.name+' did not sell. The reserve was not met.</p>'+note+table+'<p>It\'s now available to buy outright at '+money(salePrice(id))+'.</p><p><button class="small" data-view="'+id+'">View on map</button></p>');
    return null}
  if(top.k==='you'){spend('land',top.b);acquire(id,sl.admin);news(P.name+' sold to you for '+money(top.b)+'.');
    const over=top.b-(bids[1]?bids[1].b:reserve);
    mail('Auction house','You won '+P.name,'<p>Congratulations. '+P.name+' is yours for '+money(top.b)+'.</p>'+(liveBids?'':'<p>'+(over>sl.guide*.15?'You left '+money(over)+' on the table over the next best offer. Ouch.':'You got it without overpaying much. Nicely judged.')+'</p>')+table+'<p><button class="small primary" data-go="'+id+'">Go to course</button></p>');
    toast('You won '+P.name+'.',4000)}
  else{S.rivals[top.k].cash-=top.b;S.rc[id]={o:top.k,rep:sl.admin?2.7:2.4,day:S.day};
    news(P.name+' goes to '+RIV[top.k].name+' for '+money(top.b)+'.');
    if(sl.mine||liveBids)mail('Auction house','Outbid on '+P.name,'<p>'+RIV[top.k].name+' won '+P.name+' with '+money(top.b)+'.</p>'+note+table)}
  if(R.view==='map')renderOverlay();
  return top.k;
}
/* live */
const AUC_R=['{n} on the telephone. {m}.','{m}, {n} at the back of the room.','{n} nods. {m}.','{m} from {n}, without hesitation.','{n} again. {m}.'];
function attend(id){const sl=S.market.sales[id];if(!sl||sl.type!=='live'||sl.closes!==S.day)return;closeSheet();
  const maxes={};sl.int.forEach(k=>{if(rivalCount(k)<RIV[k].max)maxes[k]=rivalBid(k,sl)});
  R.auc={id,sl,inc:Math.max(1000,Math.round(sl.guide*.04/1000)*1000),cur:Math.round(sl.guide*.7/1000)*1000,lead:null,quiet:0,nextR:1400,stage:0,maxes,log:[],over:false};
  aucSay('Lot one. '+PL[id].name+', '+PL[id].area+'. '+(sl.admin?'A going concern, more or less. ':'')+'Who will start me at '+money(R.auc.cur)+'?');
  openModal('');renderAuction();
}
function aucNext(){const A=R.auc;return A.lead?A.cur+A.inc:A.cur}
function aucSay(t){const A=R.auc;A.log.unshift(t);if(A.log.length>5)A.log.length=5}
function aucBid(k){const A=R.auc;if(!A||A.over)return;const amt=aucNext();if(k==='you'&&(S.cash<amt||(A.lead==='you'&&A.cur>=Math.round(A.sl.guide*.9/1000)*1000)))return;
  A.cur=amt;A.lead=k;A.quiet=0;A.stage=0;A.nextR=900+Math.random()*1000;
  aucSay(k==='you'?fill(rnd(['{m}, the bidder in the front row. That\'s you.','{m}, thank you. New bidder.','{m} in the room.']),{m:money(amt)}):fill(rnd(AUC_R),{n:RIV[k].name,m:money(amt)}));
  renderAuction()}
function stepAuction(dt){const A=R.auc;if(!A||A.over)return;A.quiet+=dt;
  if(A.quiet>=A.nextR){const nx=aucNext(),el=Object.keys(A.maxes).filter(k=>k!==A.lead&&A.maxes[k]>=nx);
    if(el.length){const k=rnd(el);if(nx<A.maxes[k]*.88||Math.random()<.45||A.quiet>5600){aucBid(k);return}A.nextR=A.quiet+800}else A.nextR=1e9}
  const st=A.quiet>=7000?3:A.quiet>=5000?2:A.quiet>=3000?1:0;
  if(st>A.stage){A.stage=st;
    if(st===1)aucSay(A.lead?'Going once, at '+money(A.cur)+'...':'Come along. Do I hear '+money(A.cur)+'?');
    else if(st===2)aucSay(A.lead?'Going twice...':'Last chance at '+money(A.cur)+'...');
    else{aucEnd();return}
    renderAuction()}
}
function aucEnd(){const A=R.auc;A.over=true;const reserve=Math.round(A.sl.guide*.9/1000)*1000;
  if(!A.lead||A.cur<reserve){aucSay(A.lead?'I\'m sorry, the reserve has not been met. Lot withdrawn.':'No bids. Lot withdrawn.');A.won=resolveSale(A.id,A.lead?[]:[])}
  else{aucSay('Sold! To '+(A.lead==='you'?'you':RIV[A.lead].name)+', for '+money(A.cur)+'.');A.won=resolveSale(A.id,[{k:A.lead,b:A.cur}])}
  renderAuction()}
function aucDrop(){const A=R.auc;if(!A||A.over)return;
  const c=Object.keys(A.maxes).filter(k=>A.maxes[k]>=(k===A.lead?A.cur:aucNext())).sort((a,b)=>A.maxes[b]-A.maxes[a]);
  if(c.length){const k=c[0],second=c[1]?A.maxes[c[1]]+A.inc:A.cur;const price=k===A.lead&&!c[1]?A.cur:Math.max(A.cur+(k===A.lead?0:A.inc),Math.min(A.maxes[k],second));
    A.lead=k;A.cur=price;aucSay('You drop out. '+RIV[k].name+' carries on to '+money(price)+'.')}
  else aucSay('You drop out.');
  aucEnd()}
function renderAuction(){const A=R.auc;if(!A)return;const P=PL[A.id],nx=aucNext();
  const st=['','Going once','Going twice','Sold'][A.stage];
  let btns;
  if(A.over)btns='<button class="primary" id="aDone">'+(A.won==='you'?'Go to your new course':'Back to the map')+'</button>';
  else btns='<button class="primary big1" id="aBid"'+((A.lead==='you'&&A.cur>=Math.round(A.sl.guide*.9/1000)*1000)||S.cash<nx?' disabled':'')+'>'+(A.lead==='you'?(A.cur<Math.round(A.sl.guide*.9/1000)*1000?'Below reserve. Raise to '+money(nx):'You are the high bidder'):S.cash<nx?'Can\'t afford '+money(nx):'Bid '+money(nx))+'</button><button id="aDrop">'+(A.lead==='you'?'Leave it there':'Drop out')+'</button>';
  openModal('<div class="auc"><small>Live auction, '+P.area+'</small><h2>'+P.name+'</h2><p class="desc">Guide '+money(A.sl.guide)+'. '+TERRAIN[P.terrain].name+', '+P.holes+' holes'+(A.sl.admin?', with a built course and clubhouse':'')+'.</p>'+
    '<div class="aucbid"><span>'+money(A.cur)+'</span><small>'+(A.lead?(A.lead==='you'?'You lead':RIV[A.lead].name+' leads'):'Opening bid, no takers yet')+'</small></div>'+
    '<div class="gavel'+(A.stage?' on':'')+'">'+(st||'&nbsp;')+'</div>'+
    '<div class="alog">'+A.log.map((l,i)=>'<p'+(i?' class="old"':'')+'>'+l+'</p>').join('')+'</div>'+
    '<p class="info">Your cash: <b>'+money(S.cash)+'</b></p><div class="abtns">'+btns+'</div></div>');
  if($('#aBid'))$('#aBid').onclick=()=>aucBid('you');
  if($('#aDrop'))$('#aDrop').onclick=()=>{if(A.lead==='you'){A.quiet=Math.max(A.quiet,3000)}else aucDrop()};
  if($('#aDone'))$('#aDone').onclick=()=>{const id=A.id,won=A.won==='you';R.auc=null;closeModal();save();if(won)showCourse(id);else{showMap()}};
}

/* ---------- members ---------- */
function memCap(C){return C.holes.length*25}
function fairSub(C){return Math.round(fairFee(C)*30/50)*50}
function moodName(m){return m>=60?'Happy':m>=40?'Content':m>=25?'Grumbling':'Mutinous'}
function memDay(C){const M=C.mem;if(!M.on)return 0;const P=PL[C.plotId],cap=memCap(C);
  let d=(65-M.mood)*.03;
  if(C.cond<65){d-=1.5;M.cause='the state of the course'}else if(C.cond>=85)d+=1;
  if(C.rep>=4)d+=.5;
  if(C.today.vis>Math.max(60,C.today.memR*4)){d-=.6;M.cause='the number of visitors on the course'}
  if((C._edits||0)>25){d-=3;M.cause='changes to the course made without consultation'}C._edits=0;
  M.mood=clamp(M.mood+d,0,100);
  const target=cap*clamp(P.demand/4,.4,1.4)*(C.rep/4.5)*clamp(1.6-M.sub/fairSub(C)*.6,.2,1.4)*clamp(M.mood/70,.4,1.15);
  M.wait=Math.max(0,Math.round(target-cap));const goal=Math.min(cap,target);
  M.n=Math.round(M.n+(goal-M.n)*.1+Math.sign(goal-M.n)*Math.min(2,Math.abs(goal-M.n)));
  if(M.mood<35)M.n=Math.round(M.n*.97);M.n=clamp(M.n,0,cap);
  const band=M.mood>=60?3:M.mood>=40?2:M.mood>=25?1:0,P2=PL[C.plotId].name;
  if(band<M.band){
    if(band===2)mail('Club committee, '+P2,'A note of concern','<p>Dear owner,</p><p>The committee wishes to record its concern about '+(M.cause||'recent developments')+'. We trust this will be addressed.</p><p>Yours, on behalf of the members</p>');
    if(band===1)mail('Club committee, '+P2,'Feelings are running high','<p>Dear owner,</p><p>Feelings are running high in the bar about '+(M.cause||'the way the club is run')+'. Until matters improve, the committee will withhold its support for any further tournaments.</p><p>Yours, with some regret</p>');
    if(band===0)mail('Club committee, '+P2,'Motion of no confidence','<p>Dear owner,</p><p>Members are resigning. A motion of no confidence has been tabled for the next general meeting.</p><p>The committee</p>');
  }else if(band===3&&M.band<3)mail('Club committee, '+P2,'With thanks','<p>Dear owner,</p><p>The committee would like to place on record its thanks. Morale in the bar is the best it has been for some time.</p>');
  M.band=band;
  return Math.round(M.n*M.sub/100);
}
function memHtml(C){const M=C.mem;
  if(!M.on)return '<div class="fac"><div><b>Members</b>: pay and play only<small>Members pay a yearly subscription that ignores the weather, count towards prestige, and get first call on morning tee times. They also come with a committee.</small></div><button class="small primary" data-mem="on">Welcome members</button></div>';
  const cap=memCap(C);
  return '<div class="fac"><div><b>Members</b>: '+M.n+' of '+cap+(M.wait?', <b>'+M.wait+'</b> waiting':'')+'<div class="bar"><i style="width:'+Math.round(M.n/cap*100)+'%"></i></div><small>Subscription '+money(M.sub)+' a year, bringing in about '+money(M.n*M.sub/100)+' a day. Locals think '+money(fairSub(C))+' is fair.</small></div><button class="small" data-sub="-1">Lower</button><button class="small" data-sub="1">Raise</button></div>'+
    '<div class="fac"><div><b>Committee</b>: '+moodName(M.mood)+'<div class="bar"><i style="width:'+Math.round(M.mood)+'%;background:'+(M.mood<40?'var(--warn)':'var(--club)')+'"></i></div><small>Keep the course in good nick, don\'t flood it with visitors, consult before redesigns. Below 40 they block tournaments, below 35 members resign.</small></div><button class="small" data-mem="off">'+(R.confirmOff===C.plotId?'Tap again':'Disband')+'</button></div>';
}
function coastHtml(C){if(!C.coast||!C.coast.length)return '';
  const lost=C.ero.reduce((a,b)=>a+b,0)-C.ero0,lv=C.fac.sea,names=['No defences','Rock armour','Sea wall'],cost=[0,40000,120000];
  return '<div class="fac"><div><b>Coastline</b>: '+names[lv]+'<small>Holes '+C.coast.map(i=>i+1).join(', ')+' run along the shore. '+(lost?'The sea has taken about <b>'+(lost*YPC)+' yards</b> of land so far.':'No land lost yet.')+' Storms eat away at shoreline holes; rock armour halves the damage, a sea wall stops it.</small></div>'+
    (lv<2?'<button class="small" data-sea="1"'+(S.cash<cost[lv+1]?' disabled':'')+'>'+names[lv+1]+', '+short(cost[lv+1])+'</button>':'<small>Protected</small>')+'</div>';
}
function bindClubExtras(C,el){
  el.querySelectorAll('[data-mem]').forEach(b=>b.onclick=()=>{const M=C.mem;
    if(b.dataset.mem==='on'){M.on=true;M.n=Math.round(memCap(C)*.12);M.sub=fairSub(C);M.mood=70;M.band=3;news(PL[C.plotId].name+' becomes a members\' club.');
      sayText('Members, then. A committee, a dress code and a strongly worded notice about mobile phones in the bar. Very good.')}
    else{if(R.confirmOff!==C.plotId){R.confirmOff=C.plotId;renderClub();return}R.confirmOff=null;
      M.on=false;M.n=0;M.wait=0;C.rep=clamp(C.rep-.4,0,5);news('Uproar at '+PL[C.plotId].name+' as the owner disbands the membership.');sayText('The members have been shown the door. I suspect we\'ll be reading about this.')}
    save();renderClub();hud()});
  el.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{const M=C.mem,st=Math.max(50,Math.round(fairSub(C)*.05/50)*50);
    M.sub=Math.max(50,M.sub+st*+b.dataset.sub);if(+b.dataset.sub>0){M.mood=clamp(M.mood-3,0,100);M.cause='the subscription increase'}else M.mood=clamp(M.mood+1,0,100);save();renderClub()});
  el.querySelectorAll('[data-sea]').forEach(b=>b.onclick=()=>{const cost=[0,40000,120000][C.fac.sea+1];if(S.cash<cost)return;spend('fac',cost);C.fac.sea++;save();renderClub();hud();
    sayText(C.fac.sea===1?'Rock armour going in along the shore. Several thousand tonnes of granite, and the sea is not impressed.':'A proper sea wall. King Canute would be green with envy.')});
}

/* ---------- erosion ---------- */
function coastFor(p,n){const k=Math.round(p.lat*100+p.lon*10),c=[];for(let i=0;i<n;i++)if(hsh(i,k,77)<.36)c.push(i);
  if(c.length<2){[Math.floor(n/2),n-1].forEach(i=>{if(!c.includes(i))c.push(i)})}return c.sort((a,b)=>a-b)}
function stormDay(C,force){
  if(!force&&C.wx!=='storm')return;if(!C.coast||!C.coast.length)return;
  const P=PL[C.plotId],lv=C.fac.sea,hit=[];
  for(let t=0;t<ri(1,2);t++){const hi=rnd(C.coast),rows=lv===2?0:lv===1?(Math.random()<.5?1:0):ri(1,2);if(!rows)continue;
    const H=C.holes[hi],old=C.ero[hi],nl=Math.min(10,old+rows);if(nl===old)continue;
    for(let y=old;y<nl;y++)for(let x=0;x<COLS;x++)H.g[idx(x,y)]=SEA;
    C.ero[hi]=nl;let gone=false;
    if(H.pin&&H.pin.y<nl){H.pin=null;H.lostGreen=true;gone=true}
    dirty(C,H);hit.push({hi,yd:(nl-old)*YPC,gone})}
  if(!hit.length){if(lv)mail('Head greenkeeper, '+P.name,'Storm last night','<p>Big storm last night. The '+(lv===2?'sea wall':'rock armour')+' took a battering but held. Not a yard lost.</p>');return}
  const gone=hit.filter(h=>h.gone);
  if(gone.length&&C.open){C.open=false}
  news('Storm batters '+P.name+'. '+(gone.length?'A green has been lost to the sea.':'Land lost on the shore holes.'));

function gazette(){const wk=Math.floor(S.day/7),M=S.market,ids=Object.keys(M.sales);
  const ord={live:0,sealed:1,quiet:2};ids.sort((a,b)=>ord[M.sales[a].type]-ord[M.sales[b].type]||(M.sales[a].closes||99)-(M.sales[b].closes||99));
  const opp=id=>{const sl=M.sales[id],P=PL[id],r=sl.rum.map(k=>RIV[k].short);
    const t=sl.type==='live'?'Live auction on '+dTxt(sl.closes,1)+', guide '+money(sl.guide):sl.type==='sealed'?'Sealed bids close '+dTxt(sl.closes,1)+', guide '+money(sl.guide):'Asking '+money(salePrice(id))+', no other buyers';

  let pickId=null,best=-1;ids.forEach(id=>{const P=PL[id],v=(P.demand*P.wealth*P.prestige)/(salePrice(id)/100000)*(M.sales[id].rum.length?.7:1.2);if(v>best){best=v;pickId=id}});

  h+='<h4>Up for grabs</h4>'+(ids.length?ids.slice(0,8).map(opp).join(''):'<p>Slim pickings this week. Keep an eye out for administrations.</p>');
  h+='<h4>Rival watch</h4>'+Object.keys(RIV).map(k=>{const n=rivalCount(k),c=S.rivals[k].cash;return '<p><b style="color:'+RIV[k].col+'">'+RIV[k].name+'</b>: '+n+(n===1?' course':' courses')+', '+(c>1500000?'pockets bottomless':c>600000?'well funded':c>200000?'comfortable':'stretched thin')+'.</p>'}).join('');

function featureDue(){for(const id in S.courses){const C=S.courses[id];if(!C.open||courseIssue(C))continue;
  if(C.nextRev===undefined){C.nextRev=S.day+ri(6,10);continue}
  if(S.day>=C.nextRev){C.nextRev=S.day+ri(18,28);featureReview(C);return}}}
function featureReview(C){
  const P=PL[C.plotId],q=quality(C),TR=TERRAIN[P.terrain],n=C.holes.length,fair=fairFee(C)*(1+q.interest*.3);
  const rv=C.reviews.slice(0,15),avg=rv.length?rv.reduce((a,b)=>a+b.stars,0)/rv.length:C.rep;
  let sc=avg*1.4+(q.design-4)*.8+q.variety*1.5+(C.cond-70)/30+C.fac.club*.25+C.fac.range*.3+(P.prestige-1)*2-q.weak/n*4-Math.max(0,C.fee/fair-1)*3+(Math.random()-.5);
  sc=clamp(Math.round(sc),1,10);
  let si=0,sv=-1;C.holes.forEach((H,i)=>{const v=analyzeHole(H).score;if(v>sv){sv=v;si=i}});
  const SH=C.holes[si],sc2=holeCounts(SH),shy=Math.round(holeYards(SH));
  const sett={links:P.name+' sits on proper links land at '+P.area+'. Firm turf, big skies, and a wind that never quite stops.',
    heathland:'Pine, heather and sandy soil at '+P.area+'. The ground drains like a sieve, which in this country counts as a minor miracle.',
    parkland:'Big old trees and soft turf at '+P.area+'. The kind of English parkland that makes you want a pint before you have even teed off.',
    moorland:'Upland golf at '+P.area+'. Rugged, wild and frequently damp, though the views do their very best to compensate.'}[P.terrain];
  const club=['The clubhouse is a portacabin with a kettle, which tells you most of what you need to know about the budget.','The clubhouse is modest but warm, and the tea is hot.','The clubhouse restaurant does a very respectable steak pie, and the bar staff know what they are doing.','The grand clubhouse is a statement, all oak panelling and honours boards, and a lunch you will want to linger over.'][C.fac.club];
  const des=q.design>=7.5?'Design is the star here. The bunkering asks questions off every tee, and there is barely a lazy hole on the card.':q.design>=5.5?'The design is sound if a little unadventurous. Nothing offends, though not much sticks in the memory either.':'The design is thin. Too many holes are simply grass between a tee and a green, with very little to think about.';
  const vari=q.variety>0?' The mix of par threes, fours and fives keeps the round moving nicely.':q.variety<0?' The card is monotonous, hole after hole of much the same length.':'';
  const stand=' The standout is the '+ORD(si+1)+', a '+shy+' yard par '+holePar(SH)+(function(){const fl=analyzeHole(SH).feats.filter(f=>f.p>0).slice(0,2).map(f=>f.n.toLowerCase());return fl.length?', with '+fl.join(' and '):''})()+'. '+(sv>=8?'A genuine signature hole, the kind people drive hours to play.':sv>=6?'Memorable for all the right reasons.':'Solid, if not spectacular.');
  const weak=q.weak?' A couple of holes feel unfinished, and the round sags because of it.':'';
  const cond=C.cond>=85?'Conditioning is superb. The greens rolled true all day and the fairways were like carpet.':C.cond>=70?'Condition is decent, with a few tired patches that more staff would sort out.':'Condition is poor. Bare patches, bumpy greens, and a greenkeeping team clearly stretched to breaking point.';
  const val=C.fee>fair*1.1?' At '+money(C.fee)+' a round it is overpriced, and the half empty car park suggests the locals agree.':C.fee<fair*.75?' At '+money(C.fee)+' a round it is an outright bargain.':' At '+money(C.fee)+' a round, the price feels about right.';
  const mem=C.mem.on?' As a members\' club it has a proper sense of belonging, though visitors may feel the occasional stare from the bar.':'';
  const coast=C.coast&&C.ero.reduce((a,b)=>a+b,0)>C.ero0+2?' One worry: the sea is visibly eating the shoreline holes, and the owners will need to act.':'';
  const verdict=sc>=9?'A genuine gem. Book now, before everyone else does.':sc>=7?'Well worth the trip. A course with real ambition.':sc>=5?'Promising, but not there yet. Worth a look if you are passing.':'Hard to recommend at the moment. Come back in a year.';
  const head=sc>=9?'A masterpiece at '+P.name:sc>=7?P.name+': well worth the trip':sc>=5?P.name+' shows promise':P.name+': a good walk spoiled';
  const body='<p class="byline">By Fenella Ashcombe</p><p class="kick">'+TR.name+', '+n+' holes, par '+q.par+', '+q.yards.toLocaleString('en-GB')+' yards</p>'+
    '<p>'+sett+' '+club+'</p><p>'+des+vari+stand+weak+'</p><p>'+cond+val+mem+coast+'</p><p><b>Verdict.</b> '+verdict+'</p><p class="score">'+sc+' out of 10</p>';
  if(sc>=8){C.buzz={until:S.day+7,m:1.25};C.rep=clamp(C.rep+.15,0,5)}else if(sc<=4){C.buzz={until:S.day+7,m:.85};C.rep=clamp(C.rep-.15,0,5)}
  news('The Fairway Review gives '+P.name+' '+sc+' out of 10.');
  mail('The Fairway Review',head,body+'<p><button class="small" data-go="'+C.plotId+'">Go to course</button></p>');
  return sc;
}

/* ---------- calendar & seasons ---------- */
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],DOWL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],
  MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],MONL=['January','February','March','April','May','June','July','August','September','October','November','December'];
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dOf(day){const p=((S&&S.date0)||todayISO()).split('-').map(Number);return new Date(p[0],p[1]-1,p[2]+((day??S.day)-1),12)}
function dTxt(day,wd){const d=dOf(day);return (wd?DOW[d.getDay()]+' ':'')+d.getDate()+' '+MON[d.getMonth()]}
function dLong(day){const d=dOf(day);return DOWL[d.getDay()]+' '+d.getDate()+' '+MONL[d.getMonth()]+' '+d.getFullYear()}
function seasonM(day){return [.7,.72,.82,.92,1.05,1.12,1.12,1.1,1,.92,.8,.72][dOf(day).getMonth()]}
function weekdayM(day){const w=dOf(day).getDay();return w===6||w===0?1.35:w===5?1.1:1}
function winter(day){const m=dOf(day).getMonth();return m>=9||m<=1}
function seasonName(day){const m=dOf(day).getMonth();return m<=1||m===11?'Winter':m<=4?'Spring':m<=7?'Summer':'Autumn'}

/* ---------- money ledger ---------- */
const LED_IN=[['fees','Green fees'],['bar','Bar and shop'],['mem','Member subscriptions'],['events','Tournaments'],['sales','Course sales']],
  LED_OUT=[['upkeep','Upkeep'],['wages','Staff wages'],['build','Building work'],['fac','Facilities'],['land','Land and clubs bought']];
function newLed(){const l={start:S?S.cash:0};LED_IN.concat(LED_OUT).forEach(([k])=>l[k]=0);return l}
function earn(k,a){S.cash+=a;if(S.led)S.led[k]=(S.led[k]||0)+a}
function spend(k,a){S.cash-=a;if(S.led)S.led[k]=(S.led[k]||0)+a}

/* ---------- hole analysis: what makes a hole interesting ---------- */
const FEAT_TIPS={dogleg:'Bend the fairway round a corner to make a dogleg.',water:'Water in front of or around the green is the quickest way to make a hole memorable.',
  showcase:'A big sweeping bunker, ten tiles or more, gives a hole a signature look.',guard:'Ring the green with three or more bunkers.'};
function analyzeHole(H){
  if(H._a)return H._a;const out={feats:[],score:0,tips:[]};
  if(holeIssue(H))return H._a=out;
  const g=H.g,c=holeCounts(H),par=holePar(H),yd=holeYards(H),tee=center(H.tee),pin=center(H.pin);
  const at=(x,y)=>inb(x,y)?g[idx(x,y)]:-1,wet=t=>t===4||t===7,F=[],add=(k,n,p)=>F.push({k,n,p});
  // green surround
  let ring=0,wr=0;
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(g[idx(x,y)]===2)for(let j=-1;j<=1;j++)for(let i=-1;i<=1;i++){if(!i&&!j)continue;const t=at(x+i,y+j);if(t!==2){ring++;if(wet(t))wr++}}
  const wg=ring?wr/ring:0;
  if(wg>=.7)add('island','Island green',3.2);else if(wg>=.3)add('watergreen','Water guarding the green',1.5);
  // carry on the line from tee to pin
  let carry=false;for(let s=.1;s<=.9;s+=.02){if(wet(at(Math.floor(tee.x+(pin.x-tee.x)*s),Math.floor(tee.y+(pin.y-tee.y)*s)))){carry=true;break}}
  if(carry&&wg<.7)add(par===3?'p3water':'carry',par===3?'Tee shot over water':'Carry over water',par===3?2.2:1.6);
  // fairway centreline
  const rows=[];
  for(let y=Math.floor(Math.min(tee.y,pin.y));y<=Math.floor(Math.max(tee.y,pin.y));y++){let s=0,n=0,mn=99,mx=-1;
    for(let x=0;x<COLS;x++)if(g[idx(x,y)]===1){s+=x+.5;n++;if(x<mn)mn=x;if(x>mx)mx=x}if(n)rows.push({y:y+.5,x:s/n,mn,mx,n})}
  let dmax=0,dmin=0,pk=null;
  rows.forEach(r=>{const t=(r.y-tee.y)/((pin.y-tee.y)||1),d=r.x-(tee.x+(pin.x-tee.x)*t);if(d>dmax){dmax=d;if(d>=-dmin)pk=r}if(d<dmin){dmin=d;if(-d>dmax)pk=r}});
  let dog=false;
  if(par>3&&rows.length>=5){
    if(dmax>=1.6&&dmin<=-1.6){add('double','Double dogleg',2.2);dog=true}
    else if(Math.max(dmax,-dmin)>=1.8){add('dogleg','Dogleg '+(pin.x<(pk?pk.x:8)?'left':'right'),1.6);dog=true}
    const w=rows.reduce((a,r)=>a+r.n,0)/rows.length;if(w<2.2)add('narrow','Fairway too narrow',-1)}
  // bunker clusters
  const seen=new Uint8Array(g.length),cl=[];
  for(let i=0;i<g.length;i++)if(g[i]===3&&!seen[i]){const st=[i];let n=0,sx=0,sy=0;seen[i]=1;
    while(st.length){const k=st.pop(),x=k%COLS,y=(k/COLS)|0;n++;sx+=x;sy+=y;for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const xx=x+dx,yy=y+dy;if(inb(xx,yy)){const kk=idx(xx,yy);if(!seen[kk]&&g[kk]===3){seen[kk]=1;st.push(kk)}}}}
    cl.push({n,x:sx/n+.5,y:sy/n+.5})}
  const big=cl.reduce((a,b)=>Math.max(a,b.n),0);
  if(big>=18)add('waste','Vast waste bunker',2);else if(big>=10)add('showcase','Showcase bunker',1.6);
  if(cl.filter(b=>Math.hypot(b.x-pin.x,b.y-pin.y)<=4.2).length>=3)add('guard','Well guarded green',1);
  if(cl.filter(b=>b.n<=2).length>=5)add('pots','Pot bunkers',1);
  // water near the line of play
  if(!carry&&wg<.3){let wip=false;rows.forEach(r=>{for(let x=r.mn-1;x<=r.mx+1&&!wip;x++)if(wet(at(x,Math.floor(r.y-.5))))wip=true});if(wip)add('wip','Water in play',.7)}
  // trees framing the fairway
  if(rows.length>=5){const tl=rows.filter(r=>{const y=Math.floor(r.y-.5);let L=false,Rr=false;for(let k=1;k<=2;k++){if(at(r.mn-k,y)===5)L=true;if(at(r.mx+k,y)===5)Rr=true}return L&&Rr}).length/rows.length;if(tl>=.6)add('trees','Tree lined',.8)}
  // risk and reward: hazard near the corner of a dogleg
  if(dog&&pk){let hz=false;for(let y=Math.floor(pk.y-4);y<=pk.y+3&&!hz;y++)for(let x=0;x<COLS;x++){const t=at(x,y);if((wet(t)||t===3||t===5)&&Math.abs(x+.5-pk.x)>1.5&&Math.abs(x+.5-pk.x)<5&&(Math.sign(x+.5-pk.x)===Math.sign(pin.x-pk.x))){hz=true;break}}if(hz)add('risk','Risk and reward corner',1.4)}
  if(par===4&&yd<=300&&F.some(f=>['guard','watergreen','island','showcase','waste'].includes(f.k)))add('drive','Driveable par 4',1.2);
  if(!F.some(f=>f.p>0))add('bland','Bland, nothing to think about',-.8);
  const pos=F.filter(f=>f.p>0).sort((a,b)=>b.p-a.p),neg=F.filter(f=>f.p<0);
  let sc=3.8+Math.min(c.b,10)*.05+Math.min(c.t,30)*.012;pos.forEach((f,i)=>sc+=f.p*[1,.8,.65,.5,.4,.3,.3][Math.min(i,6)]);neg.forEach(f=>sc+=f.p);
  out.score=Math.round(clamp(sc,1,10)*10)/10;out.feats=pos.concat(neg);
  const has=k=>F.some(f=>f.k===k);
  if(par>3&&!dog)out.tips.push(FEAT_TIPS.dogleg);
  if(!has('island')&&!has('watergreen')&&!carry)out.tips.push(FEAT_TIPS.water);
  if(!has('showcase')&&!has('waste'))out.tips.push(FEAT_TIPS.showcase);
  if(!has('guard'))out.tips.push(FEAT_TIPS.guard);
  if(has('narrow'))out.tips.unshift('Widen the fairway to at least three tiles.');
  return H._a=out;
}
function designOf(C){
  const as=C.holes.map(analyzeHole),n=as.length;if(!n)return {d:0,sig:null,kinds:0};
  const avg=as.reduce((a,b)=>a+b.score,0)/n,kinds=new Set();as.forEach(a=>a.feats.forEach(f=>{if(f.p>0)kinds.add(f.k)}));
  const pars=new Set(C.holes.filter(H=>!holeIssue(H)).map(holePar));let best=0,bi=null;as.forEach((a,i)=>{if(a.score>best){best=a.score;bi=i}});
  const d=avg*.85+Math.min(1.5,kinds.size*.2)+(pars.size>=3?.3:pars.size===1?-.4:0)+(best>=8.5?.3:0);
  return {d:Math.round(clamp(d,0,10)*10)/10,sig:best>=7.5?bi:null,kinds:kinds.size,best};
}
function quality(C){
  if(C._q)return C._q;let interest=0,beauty=0,weak=0,par=0,yards=0;const pars=new Set();
  C.holes.forEach(H=>{const c=holeCounts(H);
    interest+=Math.min(1,c.b/6)*.6+Math.min(1,c.w/8)*.45+Math.min(1,c.t/25)*.25;
    beauty+=Math.min(1,c.t/30)*.5+Math.min(1,c.w/8)*.4;
    const p=holePar(H),y=holeYards(H);par+=p;yards+=y;pars.add(p);
    if(y<100||(p>3&&c.f<5))weak++});
  const n=C.holes.length,ds=designOf(C);
  return C._q={interest:interest/n,beauty:beauty/n,variety:pars.size>=3?.3:pars.size===2?0:-.3,weak,par,yards:Math.round(yards),design:ds.d,sig:ds.sig};
}
function designWord(d){return d>=8.5?'Masterpiece':d>=7.5?'Championship class':d>=6.5?'Excellent':d>=5.5?'Good':d>=4?'Ordinary':'Basic'}

/* ---------- signature hole generator (legendary venues and rivals) ---------- */
function fancyHole(par,terrain,old,lost){
  lost=lost||0;const g=old.slice(),set=(x,y,t)=>{if(inb(x,y)&&g[idx(x,y)]!==SEA)g[idx(x,y)]=t};
  for(let i=0;i<g.length;i++)if(g[i]!==T.TREES&&g[i]!==SEA)g[i]=T.ROUGH;
  const len=Math.min(par===3?ri(8,12):par===4?ri(18,23):ri(26,28),28-lost),teeY=30,gy=teeY-len,side=Math.random()<.5?-1:1;
  const dog=par>3&&Math.random()<.65,cy=teeY-Math.round(len*(.5+Math.random()*.12));
  const cxAt=dog?(y=>clamp(Math.round(y>=cy?8:8+side*Math.min(5,(cy-y)*1.1)),3,12)):(y=>clamp(Math.round(8+side*1.2*((teeY-y)/len)),3,12));
  for(let y=gy-4;y<=teeY+1;y++){const cx=cxAt(y);for(let x=cx-3;x<=cx+3;x++)if(inb(x,y)&&g[idx(x,y)]===T.TREES)g[idx(x,y)]=T.ROUGH}
  if(par>3)for(let y=gy+3;y<=teeY-3;y++){const cx=cxAt(y);for(let x=cx-1;x<=cx+2;x++)set(x,y,T.FAIRWAY)}
  else for(let y=gy+3;y<=gy+4;y++)for(let x=cxAt(y)-1;x<=cxAt(y)+1;x++)set(x,y,T.FAIRWAY);
  const gx=cxAt(gy);
  const island=par===3&&Math.random()<.45;
  if(island)for(let y=gy-4;y<=gy+4;y++)for(let x=gx-4;x<=gx+4;x++){const e=((x-gx)/3.6)**2+((y-gy)/3.1)**2;if(e<=1)set(x,y,T.WATER)}
  for(let y=gy-3;y<=gy+3;y++)for(let x=gx-3;x<=gx+3;x++)if(inb(x,y)&&g[idx(x,y)]!==SEA&&((x-gx)/2.3)**2+((y-gy)/1.9)**2<=1)g[idx(x,y)]=T.GREEN;
  if(!island){for(let k=0;k<ri(3,4);k++){const a=k*Math.PI*2/4+Math.random()*.8;const bx=Math.round(gx+Math.cos(a)*3.2),by=Math.round(gy+Math.sin(a)*2.6);
    if(inb(bx,by)&&g[idx(bx,by)]!==T.GREEN){set(bx,by,T.BUNKER);const bx2=bx+(Math.cos(a)>0?1:-1);if(inb(bx2,by)&&g[idx(bx2,by)]!==T.GREEN)set(bx2,by,T.BUNKER)}}}
  if(par===3&&!island&&Math.random()<.5)for(let y=gy+3;y<=gy+5;y++)for(let x=gx-3;x<=gx+3;x++)if(g[idx(x,y)]!==T.FAIRWAY||y>gy+3)set(x,y,T.WATER);
  if(dog){const hx=8+side*3,hy=cy-3,wtr=Math.random()<.45;for(let y=hy-2;y<=hy+1;y++)for(let x=hx-1;x<=hx+1;x++)if(g[idx(clamp(x,0,15),clamp(y,0,31))]!==T.FAIRWAY)set(x,y,wtr?T.WATER:T.BUNKER)}
  else if(par>3&&Math.random()<.5){const y0=teeY-ri(7,9);for(let y=y0;y<=y0+1;y++){const cx=cxAt(y);for(let x=cx-3;x<=cx+3;x++)set(x,y,T.WATER)}}
  if(par>3&&Math.random()<.5){const y0=ri(gy+6,teeY-8),cx=cxAt(y0),sx=cx+(Math.random()<.5?-4:4);for(let y=y0-3;y<=y0+3;y++)for(let x=sx-2;x<=sx+2;x++)if(((x-sx)/2.4)**2+((y-y0)/3.4)**2<=1&&g[idx(clamp(x,0,15),clamp(y,0,31))]!==T.FAIRWAY)set(x,y,T.BUNKER)}
  if(terrain==='links')for(let k=0;k<ri(3,6);k++){const y=ri(gy+4,teeY-4),x=cxAt(y)+(Math.random()<.5?-2:3);if(inb(x,y)&&g[idx(x,y)]===T.ROUGH)set(x,y,T.BUNKER)}
  set(8,teeY,T.TEE);
  return {g,tee:{x:8,y:teeY},pin:{x:gx,y:gy}};
}
function bestFancy(par,terrain,old,lost,tries){let best=null;for(let k=0;k<(tries||4);k++){const n=fancyHole(par,terrain,old,lost),H={g:n.g,tee:n.tee,pin:n.pin},a=analyzeHole(H);if(!holeIssue(H)&&(!best||a.score>best.s))best={n,s:a.score}}return best?best.n:genHole(par,terrain,old,lost)}

/* ---------- reputation out of 10 with ceilings ---------- */
function repTxt(r){return (r*2).toFixed(1)}
function repTiers(C){const q=quality(C),d=q.design;return [
  {cap:3.0,need:'Open and finished',ok:true},
  {cap:3.5,need:'A clubhouse and condition 70% or better',ok:C.fac.club>=1&&C.cond>=70},
  {cap:4.0,need:'Course design 6.5+ and a clubhouse with restaurant',ok:d>=6.5&&C.fac.club>=2},
  {cap:4.5,need:'Course design 7.5+ and a County Amateur hosted here',ok:d>=7.5&&C.evDone.county!==undefined},
  {cap:5.0,need:'Course design 8.5+, condition 85%+ and a Regional Pro Am hosted here',ok:d>=8.5&&C.cond>=85&&C.evDone.regional!==undefined}]}
function repCap(C){let c=3;for(const t of repTiers(C)){if(t.ok)c=t.cap;else break}return c}
function repNext(C){return repTiers(C).find(t=>!t.ok)}

/* ---------- day end ---------- */
function endDay(){closeDay()}
function closeDay(){
  if(S.dayDone)return;let rounds=0,rev=0,up=0;
  for(const id in S.courses){const C=S.courses[id];
    if(C.booked&&C.booked.day===S.day){const E=EVENTS.find(e=>e.id===C.booked.id);C.booked=null;runEvent(C,E)}
    stormDay(C);
    const mi=memDay(C);earn('mem',mi);C.today.rev+=mi;C.today.mem=mi;
    const charged=C.open||C.rounds||C.mem.on,w=charged?wage(C):0,u=charged?upkeep(C):0;
    spend('upkeep',u-w);spend('wages',w);up+=u;rounds+=C.today.rounds;rev+=C.today.rev;S.wk.profit+=C.today.rev-u;
    if(C.today.n){const avg=C.today.st/C.today.n,cap=repCap(C);C.rep=clamp(C.rep+(Math.min(avg,cap)-C.rep)*.07,0,cap)}else C.rep=Math.min(C.rep,repCap(C));
    C.lastDay={...C.today,up:u,wage:w};if(C.today.rev-u>=2000)achieve('profit');
    C.cond=clamp(C.cond+[0,3,7,12][C.fac.staff]-(C.wx==='rain'?3:C.wx==='storm'?6:0)-(winter()?1:0),20,100);
    C.today={rounds:0,rev:0,walked:0,memR:0,vis:0,mem:0,st:0,n:0};C._last=-99;C._comp=null;C._q=null;C.wx=rollWx(PL[id],S.day+1);C.holes.forEach(H=>H._ground=null)}
  S.min=1140;S.dayDone=true;S.lastLed=Object.assign({},S.led,{day:S.day,end:S.cash});
  save();
  if(S.auto){toast(dTxt(S.day,1)+': '+rounds+' rounds, '+money(rev)+' in, '+money(up)+' upkeep.',3000);startDay()}else daySummary();
}
function startDay(){
  if(!S.dayDone)return;S.dayDone=false;S.day++;S.min=420;S.led=newLed();closeModal();
  marketDay();rivalsDay();featureDue();if(S.day%7===0)gazette();checkCareer();
  if(R.view==='course'){const C=course();if(C){say('wx_'+C.wx);renderHoles();refreshPanels()}}
  if(R.view==='map')renderOverlay();
  badge();hud();save();checkScen();
}
function daySummary(){
  const L=S.lastLed||S.led,inT=LED_IN.reduce((a,[k])=>a+(L[k]||0),0),outT=LED_OUT.reduce((a,[k])=>a+(L[k]||0),0),net=L.end-L.start,other=net-(inT-outT);
  const row=(n,v,cls)=>'<tr'+(cls?' class="'+cls+'"':'')+'><td>'+n+'</td><td>'+money(Math.round(v))+'</td></tr>';
  let h='<div class="books"><p class="kick">'+dLong(L.day)+'</p><h2>Close of play</h2>';
  h+='<table><tr class="sec"><td colspan="2">Money in</td></tr>'+LED_IN.filter(([k])=>L[k]).map(([k,n])=>row(n,L[k])).join('')+(inT?'':row('Nothing today',0))+row('Total in',inT,'tot');
  h+='<tr class="sec"><td colspan="2">Money out</td></tr>'+LED_OUT.filter(([k])=>L[k]).map(([k,n])=>row(n,L[k])).join('')+(outT?'':row('Nothing today',0))+row('Total out',outT,'tot');
  if(Math.abs(other)>=1)h+=row('Other',other);
  h+='<tr class="net '+(net>=0?'up':'down')+'"><td>Net for the day</td><td>'+(net>=0?'+':'&minus;')+money(Math.abs(Math.round(net)))+'</td></tr><tr><td>In the bank</td><td><b>'+money(Math.round(S.cash))+'</b></td></tr></table>';
  const ids=Object.keys(S.courses);
  if(ids.length){h+='<h4>By course</h4>'+ids.map(id=>{const C=S.courses[id],d=C.lastDay||{rounds:0,rev:0,up:0},n=d.rev-d.up;
    return '<div class="bc"><div><b>'+PL[id].name+'</b><small>'+d.rounds+' rounds, '+money(d.rev)+' in, '+money(d.up)+' costs. Reputation '+repTxt(C.rep)+'</small></div><span class="'+(n>=0?'up':'down')+'">'+(n>=0?'+':'&minus;')+(Math.abs(n)<10000?money(Math.abs(Math.round(n))):short(Math.abs(n)))+'</span></div>'}).join('')}
  const tm=S.day+1,notes=[];
  if(weekdayM(tm)>1.2)notes.push('It\'s the weekend, so expect it busy.');
  if(seasonName(tm)!==seasonName(S.day))notes.push(seasonName(tm)+' starts tomorrow.');else if(winter(tm))notes.push('Winter: fewer golfers and more storms on the coast.');
  for(const id in S.courses){const C=S.courses[id];if(C.booked&&C.booked.day===tm)notes.push(EVENTS.find(e=>e.id===C.booked.id).name+' at '+PL[id].name+'.');if(C.wx==='storm')notes.push('Storm forecast at '+PL[id].name+'.')}
  for(const id in S.market.sales){const sl=S.market.sales[id];if(sl.type==='live'&&sl.closes===tm)notes.push('Live auction: '+PL[id].name+'.');if(sl.type==='sealed'&&sl.closes===S.day&&sl.mine)notes.push('Your sealed bid on '+PL[id].name+' is being decided overnight.')}
  if(notes.length)h+='<h4>Tomorrow, '+dTxt(tm,1)+'</h4><p>'+notes.join(' ')+'</p>';
  h+='<label class="auto"><input type="checkbox" id="autoC"'+(S.auto?' checked':'')+'> Skip this summary and carry straight on</label>';
  h+='<button class="primary big" id="nextDay">Start '+dTxt(tm,1)+'</button></div>';
  openModal(h);$('#nextDay').onclick=startDay;$('#autoC').onchange=e=>{S.auto=e.target.checked;save()};
}
function update(dt){
  R.t+=dt/1000;
  if(R.auc)stepAuction(dt);
  if(S.dayDone){if($('#modal').hidden&&!S.auto&&!R.hold)daySummary();return}
  if(!S.speed||R.hold||menuOpen())return;
  const before=S.min;S.min=Math.min(1140,S.min+dt/1000*10*S.speed);
  const mins=Math.floor(S.min)-Math.floor(before);
  for(let i=0;i<mins;i++)minuteTick();
  if(S.min>=1140)closeDay();
  const sp=Math.max(1,Math.min(S.speed,4));
  if(R.watch)stepWatch(dt*sp);
  if(R.view==='course')stepAmbient(dt*sp/1000);
}

/* ---------- selling your clubs ---------- */
function courseValue(C){const P=PL[C.plotId],q=quality(C);let build=0;
  C.holes.forEach(H=>{const c=holeCounts(H);build+=c.f*15+c.g*60+c.b*30+c.w*80+(H.tee?150:0)});
  let fac=0;FAC.forEach(F=>{for(let l=1;l<=(C.fac[F.id]||0);l++)fac+=F.cost[l]||0});fac+=[0,40000,160000][C.fac.sea||0];
  if(P.legend)return Math.round(legendGuide(C.plotId)*clamp(.75+(C.rep-4.6)*.5+(q.design-8)*.03,.4,1.05)/10000)*10000;
  const base=priceOf(C.plotId);
  return Math.round((base+build*.6+fac*.7)*(.7+C.rep/5*.6)*(.85+q.design*.03)*(C.mem.on?1+C.mem.n/memCap(C)*.15:1)/1000)*1000}
function canSell(C){return C.since===undefined||S.day>=C.since+14}
function sellUI(id){const C=S.courses[id],sh=$('#sheet'),sl=S.market.sales[id],v=courseValue(C),d=document.createElement('div');d.className='sell';
  if(sl&&sl.own)d.innerHTML='<h3>For sale</h3><p class="info">Sealed bids close at the end of '+dTxt(sl.closes,1)+'. Guide '+money(sl.guide)+'. '+(sl.rum.length?sl.rum.map(k=>RIV[k].name).join(' and ')+' rumoured to be interested.':'No rival interest rumoured yet.')+' It keeps trading as normal until it sells.</p><button id="sellX">Withdraw from sale</button>';
  else if(!canSell(C))d.innerHTML='<h3>Sell this club</h3><p class="info">Valued at about <b>'+money(v)+'</b>. You can sell from '+dTxt(C.since+14,1)+', two weeks after buying it.</p>';
  else{const q=Math.round(v*.85/1000)*1000;
    d.innerHTML='<h3>Sell this club</h3><p class="info">Valued at about <b>'+money(v)+'</b>, based on the land, the course, the facilities, reputation and design.</p><div class="row"><button id="sellQ">'+(R.confirmSell===id?'Tap again: sell for '+money(q):'Quick sale, '+money(q))+'</button><button id="sellA">Auction it</button></div>'}
  sh.appendChild(d);

function buyerFor(price,P){const ks=Object.keys(RIV).filter(k=>rivalCount(k)<RIV[k].max&&S.rivals[k].cash>=price);ks.sort((a,b)=>(RIV[b].want(P,price)?1:0)-(RIV[a].want(P,price)?1:0));return ks[0]||'private'}

  for(const k in RIV){const w=rivalCount(k)<RIV[k].max&&S.rivals[k].cash>=v*.8&&Math.random()<(RIV[k].want(PL[id],v)?.8:.45);if(w)int.push(k);if(w!==(Math.random()<.15))rum.push(k)}
  S.market.sales[id]={type:'sealed',guide:v,own:true,admin:false,closes:S.day+5,mine:null,int,rum};
  news(PL[id].name+' is up for sale. Sealed bids invited, guide '+money(v)+'.');save();toast('On the market. Bids close '+dTxt(S.day+5,1)+'.');openListing(id)}
function resolveOwn(id){const sl=S.market.sales[id];delete S.market.sales[id];const C=S.courses[id];if(!C)return;
  const bids=[];sl.int.forEach(k=>{if(rivalCount(k)>=RIV[k].max)return;const b=Math.min(Math.round(sl.guide*(RIV[k].bid[0]-.1+Math.random()*(RIV[k].bid[1]-RIV[k].bid[0]+.1))/1000)*1000,Math.floor(S.rivals[k].cash/1000)*1000);bids.push({k,b})});

function marketDay(){

  for(const id of Object.keys(M.sales)){const sl=M.sales[id];if(sl.type==='sealed'&&!sl.own&&!sl.mine&&!sl.admin&&sl.closes-S.day>1&&Math.random()<.015){delete M.sales[id];M.cool[id]=S.day+ri(10,25);news('Withdrawn before bids closed: '+PL[id].name+'. A private deal, they say.')}}
  for(const id of Object.keys(S.rc)){if(PL[id].legend||S.market.sales[id]||Math.random()>1/220)continue;const o=S.rc[id].o;delete S.rc[id];S.rivals[o].cash+=priceOf(id)*.5;const sl=newSale(id,true,ri(5,8));news(RIV[o].name+' is selling '+PL[id].name+'. '+saleNews(id,sl))}
