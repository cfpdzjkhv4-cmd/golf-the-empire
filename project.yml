# XcodeGen spec. After changing it, run `make project` (or `xcodegen generate`).
name: GolfTheEmpire

options:
  bundleIdPrefix: uk.co.harrycopeland
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GameCore:
    path: Packages/GameCore

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  GolfTheEmpire:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: GameCore
        product: GameCore
      - package: GameCore
        product: CourseArt
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: "Golf: The Empire"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.harrycopeland.golftheempire
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        # Pick your team once in Xcode: target GolfTheEmpire > Signing & Capabilities.
        DEVELOPMENT_TEAM: ""
